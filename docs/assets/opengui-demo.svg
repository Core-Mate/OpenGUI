<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 900" width="680" height="900" role="img" aria-labelledby="title desc">
  <title id="title">OpenGUI demo preview</title>
  <desc id="desc">Storyboard preview generated from the OpenGUI demo video.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171717"/>
      <stop offset="100%" stop-color="#0f0f10"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="680" height="900" rx="28" fill="url(#bg)"/>
  <rect x="18" y="18" width="644" height="864" rx="22" fill="none" stroke="#2d2d2f" stroke-width="2" stroke-dasharray="14 12"/>
  <text x="40" y="70" fill="#f5f5f5" font-size="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="700">OpenGUI Demo</text>
  <text x="40" y="110" fill="#b8b8bd" font-size="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Preview frames from the April 21 product video</text>
  <g filter="url(#shadow)">
    <rect x="40" y="150" width="600" height="675" rx="18" fill="#101113"/>
    <image x="56" y="166" width="568" height="643" preserveAspectRatio="xMidYMid slice" href="data:image/jpeg;base64,"/>
  </g>
  <g transform="translate(340 830)">
    <circle r="34" fill="#ffb000"/>
    <polygon points="-8,-13 -8,13 16,0" fill="#111111"/>
  </g>
</svg>
