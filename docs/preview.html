if(a==='edit-comment'){s.editing=true;render();$('draft-editor')?.focus()}
if(a==='cancel-edit'){s.editing=false;render()}
if(a==='save-draft'){const text=$('draft-editor').value.trim();if(!text)return toast('草稿不能为空');s.draft=text;s.editing=false;render();toast('草稿已保存，仍需审核后发送')}
if(a==='approve-comment')approve();if(a==='skip-comment'){const i=commentIndex();if(i>=0){s.comments[i].status='skipped';advanceComment();toast('已记录跳过原因：用户选择跳过')}}
if(a==='login')login();if(a==='logout'){s.user='';closeModal();render();toast('已退出演示账号')}
if(a==='send-sms'){if(!/^1\d{10}$/.test($('login-phone').value))return toast('请输入正确的 11 位手机号');if(Date.now()<smsUntil)return;smsSent=true;smsUntil=Date.now()+60000;const update=()=>{const b=$('sms-button');if(!b)return;const n=Math.max(0,Math.ceil((smsUntil-Date.now())/1000));b.disabled=n>0;b.textContent=n?'重新获取（'+n+'s）':'获取验证码';if(!n)clearInterval(smsTimer)};update();smsTimer=setInterval(update,1000);toast('短信发送演示完成，验证码为 886622')}
if(a==='do-login'){const p=$('login-phone').value;if(!/^1\d{10}$/.test(p))return toast('请输入正确的手机号');if(!smsSent||$('login-code').value!=='886622')return toast('请先获取并输入演示验证码 886622');s.user=p.slice(0,3)+'****'+p.slice(-4);closeModal();render();toast('已登录演示账号')}
if(a==='phone-submit')toast('原型手机按钮反馈：任务要求停在提交前，不模拟最终登录');
if(a==='new-task'){s.running=false;s.hasTask=false;s.done=false;s.elapsed=0;s.tab='todo';render();$('prompt').focus();toast('输入新的任务要求')}
if(a==='host-feature')toast('此入口属于 WorkBuddy 宿主，当前只演示手机插件');
if(a==='export-md'&&s.done)download('OpenGUI-report.md',reportText(),'text/markdown;charset=utf-8');
if(a==='copy-report'&&s.done){try{await navigator.clipboard.writeText(reportText());toast('已复制报告')}catch{toast('浏览器不允许复制，请下载 Markdown')}}
if(a==='export-pdf'&&s.done){$('printroot').innerHTML='<h1>OpenGUI · 任务报告</h1><pre>'+esc(reportText())+'</pre>';window.print()}
if(a==='export-doc'&&s.done)exportWord();
if(a==='export-evidence'&&s.done)download('OpenGUI-example-records.json',JSON.stringify({prototype:true,realScreenshots:false,device:dev(),comments:s.scenario==='comment'?s.comments:undefined,trace:traceSteps,report:reportText()},null,2),'application/json');
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&document.querySelector('.modal')){const els=[...document.querySelectorAll('.modal button:not(:disabled),.modal input,.modal textarea')],first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&document.activeElement===$('prompt'))document.querySelector('[data-action=send-prompt]').click();if(['ArrowLeft','ArrowRight'].includes(e.key)&&e.target.getAttribute('role')==='tab'){e.preventDefault();const tabs=['todo','trace'];s.tab=tabs[(tabs.indexOf(s.tab)+1)%2];render();$('tab-'+s.tab).focus()}});
$('demo-state')?.addEventListener('change',e=>{clearTimeout(operationTimer);s.resumeAfter=s.running||s.resumeAfter;s.running=false;s.manual=false;s.checking=false;s.mode=e.target.value;s.comments.filter(c=>c.status==='sending').forEach(c=>c.status='review');if(s.mode==='ready'&&!s.done&&s.scenario==='testing')s.running=true;render()});
setInterval(()=>{const now=performance.now(),dt=Math.min(1,(now-clockLast)/1000);clockLast=now;if(s.running&&!blocker()&&!s.manual&&!s.done&&s.scenario==='testing'){const before=s.elapsed;s.elapsed=Math.min(16,s.elapsed+dt);if(s.elapsed>=16){s.done=true;s.running=false;s.tab='todo';render()}else if((before<5&&s.elapsed>=5)||(before<10&&s.elapsed>=10)){const pane=document.querySelector('.pane'),scroll=pane?.scrollTop||0;render();document.querySelector('.pane').scrollTop=scroll}}},350);
render();
</script></body></html>
