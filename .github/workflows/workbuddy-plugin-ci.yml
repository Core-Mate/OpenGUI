name: WorkBuddy Plugin CI

on:
  push:
    paths:
      - 'workbuddy-plugin/**'
      - '.github/workflows/workbuddy-plugin-*.yml'
  pull_request:
    paths:
      - 'workbuddy-plugin/**'
      - '.github/workflows/workbuddy-plugin-*.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: ['22.19.0', '24']
    defaults:
      run:
        working-directory: workbuddy-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: workbuddy-plugin/package-lock.json
      - run: npm ci
      - run: npm run pack:release
      - run: npm audit --omit=dev --audit-level=moderate
  macos-package:
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workbuddy-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: workbuddy-plugin/package-lock.json
      - run: npm ci
      - run: npm run pack:release
      - run: npm run test:native
      - uses: actions/upload-artifact@v4
        with:
          name: workbuddy-candidate
          path: workbuddy-plugin/dist/*
          if-no-files-found: error
  packaged-startup:
    needs: [check, macos-package]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: workbuddy-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: workbuddy-plugin/package-lock.json
      - run: npm ci
      - run: npm run check
      - uses: actions/download-artifact@v4
        with:
          name: workbuddy-candidate
          path: workbuddy-plugin/dist
      - run: npm run smoke:packed
